name: openbot-production

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: openbot
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openbot -d openbot]
      interval: 2s
      timeout: 3s
      retries: 30

  platform:
    image: openbot-platform:${OPENBOT_RELEASE:?Set OPENBOT_RELEASE to the deployed commit SHA}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OPENBOT_DATABASE_URL: postgres://openbot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/openbot
      OPENBOT_PUBLIC_ORIGIN: ${OPENBOT_PUBLIC_ORIGIN:?Set OPENBOT_PUBLIC_ORIGIN}
      OPENBOT_OIDC_ISSUER: ${OPENBOT_OIDC_ISSUER:?Set OPENBOT_OIDC_ISSUER}
      OPENBOT_OIDC_CLIENT_ID: ${OPENBOT_OIDC_CLIENT_ID:?Set OPENBOT_OIDC_CLIENT_ID}
      OPENBOT_OIDC_CLIENT_SECRET: ${OPENBOT_OIDC_CLIENT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      OPENBOT_APP_ENCRYPTION_KEY: ${OPENBOT_APP_ENCRYPTION_KEY:?Set OPENBOT_APP_ENCRYPTION_KEY}
      OPENBOT_LARK_WEBHOOK_URL: ${OPENBOT_LARK_WEBHOOK_URL:-}
      OPENBOT_LARK_SIGNING_SECRET: ${OPENBOT_LARK_SIGNING_SECRET:-}
      OPENBOT_MODEL_ENDPOINT: ${OPENBOT_MODEL_ENDPOINT:-}
      OPENBOT_MODEL_API_KEY: ${OPENBOT_MODEL_API_KEY:-}
      OPENBOT_MODEL_ID: ${OPENBOT_MODEL_ID:-}
      OPENBOT_ENVIRONMENT: production
      OPENBOT_VERSION: ${OPENBOT_RELEASE:?Set OPENBOT_RELEASE to the deployed commit SHA}
      OPENBOT_INSTANCE: ${OPENBOT_INSTANCE:-}
    ports:
      - "127.0.0.1:${OPENBOT_PUBLISHED_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          const response = await fetch("http://127.0.0.1:3000/health");
          if (response.status !== 200 || (await response.json()).status !== "ok") process.exit(1)
      interval: 5s
      timeout: 5s
      retries: 12

  protocol-test:
    image: openbot-protocol-test:${OPENBOT_RELEASE:?Set OPENBOT_RELEASE to the deployed commit SHA}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PROTOCOL_TEST_PUBLIC_ORIGIN: ${PROTOCOL_TEST_PUBLIC_ORIGIN:?Set PROTOCOL_TEST_PUBLIC_ORIGIN}
      PROTOCOL_TEST_ALLOWED_ORIGINS: ${PROTOCOL_TEST_ALLOWED_ORIGINS:-${PROTOCOL_TEST_PUBLIC_ORIGIN}}

volumes:
  postgres:
