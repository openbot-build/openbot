name: openbot-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: openbot_dev
      POSTGRES_PASSWORD: openbot_dev
      POSTGRES_DB: ${OPENBOT_DEV_DATABASE_NAME:-openbot}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${OPENBOT_DEV_DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
