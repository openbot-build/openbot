services:
  protocol-test:
    build:
      context: .
      dockerfile: docker/protocol-test.Dockerfile
    image: openbot/protocol-test:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PROTOCOL_TEST_PUBLIC_ORIGIN: https://protocol-test.example.com
      PROTOCOL_TEST_ALLOWED_ORIGINS: ${PROTOCOL_TEST_ALLOWED_ORIGINS:-https://protocol-test.example.com}
