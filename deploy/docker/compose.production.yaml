name: openbot-production

# Settings that the OpenBot services share.
x-openbot: &openbot
  platform: linux/amd64
  restart: unless-stopped

x-server: &server
  <<: *openbot
  image: openbot:${OPENBOT_RELEASE:?Set OPENBOT_RELEASE to the deployed commit SHA}
  # OpenBot reads each secret from the file /run/secrets/<NAME>.
  secrets:
    - OPENBOT_DATABASE_URL
    - OPENBOT_SECRET_KEYS

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_DB: openbot
    secrets:
      - POSTGRES_PASSWORD
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openbot -d openbot]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs the database migrations once. OpenBot starts only after it succeeds.
  migrate:
    <<: *server
    restart: "no"
    command: [/app/dist/app/Migrate.mjs]
    secrets:
      - OPENBOT_DATABASE_URL
    depends_on:
      postgres:
        condition: service_healthy

  # Every other setting lives in the database. Write the first platform
  # settings once with the setup program. See the Deploy page in the docs.
  openbot:
    <<: *server
    ports:
      - "127.0.0.1:${OPENBOT_PUBLISHED_PORT:-8080}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  protocol-test:
    <<: *openbot
    image: openbot-protocol-test:${OPENBOT_RELEASE}
    environment:
      PROTOCOL_TEST_PUBLIC_ORIGIN: ${PROTOCOL_TEST_PUBLIC_ORIGIN:?Set PROTOCOL_TEST_PUBLIC_ORIGIN}
      PROTOCOL_TEST_ALLOWED_ORIGINS: ${PROTOCOL_TEST_ALLOWED_ORIGINS:-${PROTOCOL_TEST_PUBLIC_ORIGIN}}
    ports:
      - "127.0.0.1:3001:3001"

# Compose copies each value from the environment file into a file in the container.
# Unlike environment variables, these values do not show in docker inspect.
secrets:
  POSTGRES_PASSWORD:
    environment: POSTGRES_PASSWORD
  OPENBOT_DATABASE_URL:
    environment: OPENBOT_DATABASE_URL
  OPENBOT_SECRET_KEYS:
    environment: OPENBOT_SECRET_KEYS

volumes:
  postgres:
