# Starts the production setup with test settings and checks it from the inside.
# Use it on top of compose.production.yaml with check.env. See the Deploy page in the docs.
name: openbot-check

services:
  # Writes test platform settings, so the check sees a platform that is set up.
  setup:
    image: openbot:${OPENBOT_RELEASE}
    platform: linux/amd64
    command:
      - /app/dist/app/Setup.mjs
      - --public-origin=https://openbot.example.com
      - --oidc-issuer=https://id.example.com
      - --oidc-client-id=check
      - --admin-email=admin@example.com
    secrets:
      - OPENBOT_DATABASE_URL
      - OPENBOT_SECRET_KEYS
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  openbot:
    ports: !reset []
    depends_on:
      setup:
        condition: service_completed_successfully

  protocol-test:
    ports: !reset []

  check:
    image: openbot:${OPENBOT_RELEASE}
    platform: linux/amd64
    command: [/check/check.mjs]
    volumes:
      - ./check.mjs:/check/check.mjs:ro
    healthcheck:
      disable: true
    depends_on:
      openbot:
        condition: service_healthy
      protocol-test:
        condition: service_healthy
