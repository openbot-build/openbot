# Starts the production setup with test settings and checks it from the inside.
# Use it on top of compose.production.yaml with check.env. See the Deploy page in the docs.
name: openbot-check

services:
  # Writes test platform settings, so the check sees a platform that is set up.
  setup:
    image: openbot:${OPENBOT_RELEASE}
    platform: linux/amd64
    command:
      - /app/dist/app/Setup.mjs
      - --config=/check/setup.json
    volumes:
      - ./check.setup.json:/check/setup.json:ro
    secrets:
      - OPENBOT_DATABASE_URL
      - OPENBOT_SECRET_KEYS
      - OPENBOT_CLUSTER_SECRET
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  openbot:
    ports: !reset []
    volumes:
      - ./check.mjs:/check/check.mjs:ro
    depends_on:
      setup:
        condition: service_completed_successfully

  # A second process shares the database and uses its own private address.
  openbot-peer:
    extends:
      file: compose.production.yaml
      service: openbot
    ports: !reset []
    environment:
      OPENBOT_CLUSTER_HOST: openbot-peer
    volumes:
      - ./check.mjs:/check/check.mjs:ro
    depends_on:
      setup:
        condition: service_completed_successfully

  protocol-test:
    ports: !reset []

  check:
    image: openbot:${OPENBOT_RELEASE}
    platform: linux/amd64
    command: [/check/check.mjs]
    secrets:
      - OPENBOT_CLUSTER_SECRET
    volumes:
      - ./check.mjs:/check/check.mjs:ro
    healthcheck:
      disable: true
    depends_on:
      openbot:
        condition: service_healthy
      openbot-peer:
        condition: service_healthy
      protocol-test:
        condition: service_healthy
